[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invaros-tbom-spec"
version = "0.2.0"
description = "InvarOS Topology Bill of Materials (TBoM) specification, schemas, and reference validator"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "jsonschema==4.23.0",
    "referencing==0.35.1",
]

[project.urls]
Specification = "https://github.com/Yozi-Systems/invaros-tbom-spec/blob/main/SPECIFICATION.md"

[project.scripts]
tbom-validate = "validator.cli:main"

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
]

[tool.setuptools.packages.find]
include = ["validator*"]

[tool.setuptools.data-files]
"share/invaros-tbom-spec/schemas/agentic" = ["schemas/agentic/*.json"]
"share/invaros-tbom-spec/schemas/edge-network" = ["schemas/edge-network/*.json"]
"share/invaros-tbom-spec/schemas/edge-network-topology/4.0.0" = ["schemas/edge-network-topology/4.0.0/*.json"]
"share/invaros-tbom-spec/registries/edge-network/disclosure-profiles/1" = ["registries/edge-network/disclosure-profiles/1/*.json"]
